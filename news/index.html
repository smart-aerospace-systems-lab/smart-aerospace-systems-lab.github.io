---
layout: page
title: News
lead: 연구실 소식입니다.
---
<div class="container">
  <ul class="news-grid">
    {%- for post in site.posts %}
    <li>
      <a class="news-card" href="{{ post.url | relative_url }}">
        {% include media.html image=post.image alt="" %}
        <time class="news-card__date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>
        <h2 class="news-card__title">{{ post.title }}</h2>
      </a>
    </li>
    {%- endfor %}
  </ul>
</div>
