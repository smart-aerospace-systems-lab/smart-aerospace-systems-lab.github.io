- id: hybrid-hils
  title_en: Hybrid HILS
  title: 하이브리드 HILS
  summary: 실제 하드웨어와 시뮬레이션을 하나의 루프로 묶어, 비행 전에 시스템을 지상에서 시험합니다.
  detail: 비행 제어기와 추진계 같은 실제 장비를 시뮬레이션 모델과 실시간으로 연결합니다. 위험하거나 반복하기 어려운 비행 상황을 지상에서 재현하고, 고장 진단과 추진계 시험을 이 환경 안에서 함께 다룹니다.
  image: ""
  topics:
    - title: 멀티로터 모터 고장 진단
      text: PX4 기반 멀티로터에서 모터 상개방(phase-open) 같은 고장을 비행 중에 감지하고, 고장 허용 제어(FTC)로 이어 기체를 안전하게 지킵니다.
    - title: 프로펠러·추진계 시험
      text: 추력 시험대와 풍동에서 프로펠러와 모터의 추력, 토크, 전력을 측정합니다. 풍동에서는 로봇팔로 비행 자세를 재현합니다.

- id: flapping-wing
  title_en: Flapping-wing Flight
  title: 조류 모방형 날갯짓 비행체
  summary: 새의 날갯짓을 본뜬 비행체를 설계하고 만들어, 날갯짓으로 양력과 추력을 얻는 원리를 연구합니다.
  detail: 날개 구조와 날갯짓 메커니즘을 설계·제작하고, 비행 시험과 측정으로 성능을 확인합니다.  # TODO: 기체 사양, 연구 목표를 적어 주세요.
  image: ""
  topics: []

- id: uam-surveillance
  title_en: UAM Surveillance
  title: 스테레오 카메라 기반 UAM 감시 시스템
  summary: 스테레오 카메라로 도심 하늘의 비행체를 찾아내고 위치를 추정하는 감시 시스템을 개발합니다.
  detail: 두 대의 카메라 영상으로 비행체의 3차원 위치를 계산하고, 도심항공교통(UAM)이 다니는 공역을 지상에서 감시하는 방법을 연구합니다.  # TODO: 시스템 구성, 탐지 거리 등을 적어 주세요.
  image: ""
  topics: []
