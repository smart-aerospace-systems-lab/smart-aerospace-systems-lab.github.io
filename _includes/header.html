<header class="site-header{% if include.overlay %} is-overlay{% endif %}" data-header>
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__logo brand__logo--color" src="{{ '/images/logo/sasl-full.png' | relative_url }}" alt="SASL Smart Aerospace Systems Lab" width="900" height="333">
      <img class="brand__logo brand__logo--white" src="{{ '/images/logo/sasl-full-white.png' | relative_url }}" alt="" aria-hidden="true" width="900" height="333">
    </a>
    <nav class="site-nav" id="site-nav" aria-label="주 메뉴">
      <ul>
        {%- for item in site.data.nav %}
        {%- assign active = false -%}
        {%- if page.url contains item.url -%}{%- assign active = true -%}{%- endif %}
        <li><a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="sr-only">메뉴 열기</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>
  </div>
</header>
