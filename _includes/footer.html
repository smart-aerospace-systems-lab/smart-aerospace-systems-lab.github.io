<footer class="site-footer">
  <div class="container site-footer__grid">
    <div>
      <p class="site-footer__name">{{ site.title }}</p>
      <p class="site-footer__sub">{{ site.university }} {{ site.department }}<br>{{ site.university_en }}</p>
    </div>
    <div class="site-footer__contact">
      <p>{{ site.address }}{% if site.room != "" %}, {{ site.room }}{% endif %}</p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a>{% if site.phone != "" %}<br>{{ site.phone }}{% endif %}</p>
    </div>
  </div>
  <div class="container site-footer__bottom">
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </div>
</footer>
