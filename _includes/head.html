<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.url == "/" -%}
  {%- assign page_title = site.title -%}
{%- else -%}
  {%- assign page_title = page.title | append: " | " | append: site.short_title -%}
{%- endif %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#0A0E14">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
